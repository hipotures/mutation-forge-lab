name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check lockfile
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Run self-contained tests
        run: >-
          uv run pytest
          tests/unit
          tests/integration/test_experiment_ticket18.py
          tests/integration/test_toy_episode.py
          --ignore=tests/unit/test_stage5.py
          --ignore=tests/unit/test_stage6_independent.py
          --ignore=tests/unit/test_stage7_heg_bridge.py
