name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mutation-forge-lab

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: mutation-forge-lab

      - name: Check out HEG dependency
        uses: actions/checkout@v4
        with:
          repository: hipotures/heg
          path: heg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure offline Codex fixture
        run: echo "$GITHUB_WORKSPACE/mutation-forge-lab/tests/fixtures/bin" >> "$GITHUB_PATH"

      - name: Check lockfile
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Run self-contained tests
        run: >-
          uv run pytest
          tests/unit
          tests/integration/test_toy_episode.py
          --ignore=tests/unit/test_stage5.py
          --ignore=tests/unit/test_stage6_independent.py
          --ignore=tests/unit/test_stage7_heg_bridge.py
