name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mutation-forge-lab

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: mutation-forge-lab

      - name: Check out HEG dependency
        uses: actions/checkout@v4
        with:
          repository: hipotures/heg
          ref: 27cbec9c2307b6ea5f936f858821d11d808b68f3
          path: heg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Harden Python runtime permissions
        run: |
          python - <<'PY'
          import stat
          import sys
          from pathlib import Path

          root = Path(sys.base_prefix).resolve()
          executable = root / "bin" / f"python{sys.version_info.major}.{sys.version_info.minor}"
          if not root.is_dir() or not executable.is_file():
              raise SystemExit("setup-python runtime is incomplete")
          root.chmod(0o755)
          executable.chmod(0o755)
          if (
              root.stat().st_mode & stat.S_IWOTH
              or executable.stat().st_mode & stat.S_IWOTH
          ):
              raise SystemExit("setup-python runtime remains writable by other")
          PY

      - name: Install dependencies
        run: uv sync --locked

      - name: Install sandbox dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Enable sandbox user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --die-with-parent --ro-bind / / -- /usr/bin/true

      - name: Configure offline Codex fixture
        run: echo "$GITHUB_WORKSPACE/mutation-forge-lab/tests/fixtures/bin" >> "$GITHUB_PATH"

      - name: Check lockfile
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Run self-contained tests
        run: >-
          uv run pytest
          tests/unit
          tests/integration/test_toy_episode.py
          --ignore=tests/unit/test_stage5.py
          --ignore=tests/unit/test_stage6_independent.py
          --ignore=tests/unit/test_stage7_heg_bridge.py
