schema_version = "stage3.1"

[run]
run_root = "../runs/stage3-development"

[model]
name = "gpt-5.6-luna"
effort = "high"
slots = ["slot-00", "slot-01", "slot-02", "slot-03", "slot-04", "slot-05", "slot-06", "slot-07"]
max_repairs = 1

[app_server]
sandbox_mode = "danger-full-access"
approval_policy = "never"

[limits]
resource_address_space_bytes = 2147483648
resource_cpu_seconds = 120.0
resource_file_bytes = 8388608
resource_open_files = 256
resource_processes = 1024
request_bytes = 65536
response_bytes = 16384
event_bytes = 65536
transcript_bytes = 262144
stdout_bytes = 65536
stderr_bytes = 65536
turn_seconds = 120.0
campaign_seconds = 1800.0
artifact_bytes = 33554432

[resources]
max_generation_workers = 8
max_evaluation_workers = 8
reserved_physical_cores = 8
thread_count = 1

[evaluation]
bootstrap_samples = 10000
bootstrap_seed = 2026072909
confidence_level = 0.95
random_relative_threshold = 0.05
structural_fraction_threshold = 0.90

[experiment]
orders = [10, 12]
graph_seeds = [301, 302, 303, 304]
policy_seeds = [3001, 3002, 3003, 3004, 3005, 3006, 3007, 3008, 3009, 3010, 3011, 3012, 3013, 3014, 3015, 3016]
horizon = 32
shard_count = 8
episodes_per_shard = 16

[inputs]
stage2b_config = "stage2b-preregistered.toml"
random_policy = "../fixtures/rankers/stage2b_random.py"
structural_policy = "../fixtures/rankers/stage2b_structural.py"
manifest = "manifests/stage3-development-v1.json"
context_schema = "schemas/stage2b-context.schema.json"
proposal_schema = "schemas/stage2b-proposal.schema.json"
semantic_glossary = "stage3-field-semantics.v1.json"
slot_briefs_dir = "stage3-slots"
system_prompt = "../prompts/ranker_v1_system.md"
request_prompt = "../prompts/ranker_v1_request.md"
output_schema = "../prompts/ranker_v1_output_schema.json"

