schema_version = "mforge.experiment.v2"

exp_id = "heg_llm_open_ended"
workspace = "./workspace"

kind = "heg"
preset = "native"

[run]
wall_seconds = 3600
output = "rich"
profiling_enabled = false
deep_profiling_enabled = false
turn_timeout_base_seconds = 120

[model]
provider = "codex"
name = "gpt-5.6-luna"
effort = "xhigh"
concurrency = 8
max_repairs = 1

[search]
population_size = 8
max_generations = "unbounded"
max_model_turns = "unbounded"
selection = "elite-diversity"

[evaluation]
orders = [10, 12]
graph_seeds = [401, 402, 403, 404]
policy_seeds = [
  4001, 4002, 4003, 4004,
  4005, 4006, 4007, 4008,
  4009, 4010, 4011, 4012,
  4013, 4014, 4015, 4016,
]
horizon = 32
proposal_pool_size = 12
baselines = ["random", "structural"]
replay = true

[resources]
workers = 8
thread_count = 2
