schema_version = "mforge.experiment.v3"

exp_id = "exp_007"
workspace = "./workspace"

kind = "heg"
preset = "native"

[run]
wall_seconds = 72000000
turn_timeout_base_seconds = 600
max_total_tokens_per_hour = 1_000_000

[model]
provider = "codex"
name = "gpt-5.6-luna"
effort = "max"
concurrency = 2
max_repairs = 1
auth_json = "~/.codex/auth.json"

[search]
population_size = 8
max_generations = "unbounded"
max_model_turns = "unbounded"
selection = "persistent-elite-weighted-diversity"

[evaluation]
graph_mode = "unrestricted_min_degree_3"
order_schedule = "adaptive"
min_order = 22
max_order = 128
orders_per_generation = 5
graph_seeds = [401, 402, 403, 404]
policy_seeds = [
  4001, 4002, 4003, 4004,
  4005, 4006, 4007, 4008,
  4009, 4010, 4011, 4012,
  4013, 4014, 4015, 4016,
]
validation_graph_seeds = [1401, 1402, 1403, 1404]
validation_policy_seeds = [
  14001, 14002, 14003, 14004,
  14005, 14006, 14007, 14008,
  14009, 14010, 14011, 14012,
  14013, 14014, 14015, 14016,
]
horizon = 32
baselines = [
  "add-low-local-cycle-risk",
  "remove-low-bridge-risk",
  "random-valid",
  "degree-fanout",
]
replay = true

[resources]
workers = 8
thread_count = 8

[native_v3]
provider_batch_size = 4
candidate_queue_capacity = 40
evaluation_queue_capacity = 64
target_evaluation_backlog = 32
candidate_shard_size = 1
auxiliary_shard_size = 1
witness_cap = 64
