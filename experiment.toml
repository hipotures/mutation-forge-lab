schema_version = "mforge.experiment.v2"

exp_id = "exp_007"
workspace = "./workspace"

kind = "heg"
preset = "native"

[run]
wall_seconds = 72000000
turn_timeout_base_seconds = 600
max_total_tokens_per_hour = 1_000_000

[model]
provider = "codex"
name = "gpt-5.6-luna"
effort = "max"
concurrency = 2
max_repairs = 1
#auth_json = "~/.codex/auth.json"

[search]
population_size = 8
max_generations = "unbounded"
max_model_turns = "unbounded"
selection = "persistent-elite-weighted-diversity"

[evaluation]
graph_mode = "unrestricted_min_degree_3"
order_schedule = "adaptive"
min_order = 22
max_order = 128
orders_per_generation = 5
graph_seeds = [401, 402, 403, 404]
policy_seeds = [
  4001, 4002, 4003, 4004,
  4005, 4006, 4007, 4008,
  4009, 4010, 4011, 4012,
  4013, 4014, 4015, 4016,
]
horizon = 32
proposal_pool_size = 12
baselines = ["random", "structural"]
replay = false

[resources]
workers = 8
thread_count = 8
